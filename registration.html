<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Website Registration</h1>
</header>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="hobbies.html">Hobbies</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="registration.html">Register</a></li>
    </ul>
</nav>

<main>

<h2>Registration Form</h2>

<form action="thankyou.html" method="GET">

<label for="firstname">First Name:</label>
<input type="text" id="firstname" name="firstname">

<br><br>

<label for="lastname">Last Name:</label>
<input type="text" id="lastname" name="lastname">

<br><br>

<label for="email">Email:</label>
<input type="email" id="email" name="email">

<br><br>

<label for="age">Age:</label>
<input type="number" id="age" name="age">

<br><br>

<p>Favorite Subject:</p>

<input type="radio" id="psychology" name="subject" value="Psychology">
<label for="psychology">Psychology</label>

<input type="radio" id="law" name="subject" value="Law">
<label for="law">Law</label>

<input type="radio" id="wildlife" name="subject" value="Wildlife">
<label for="wildlife">Wildlife</label>

<br><br>

<p>Interests:</p>

<input type="checkbox" id="research" name="research">
<label for="research">Research</label>

<input type="checkbox" id="writing" name="writing">
<label for="writing">Writing</label>

<input type="checkbox" id="reading" name="reading">
<label for="reading">Reading</label>

<br><br>

<label for="comments">Comments:</label>

<br>

<textarea id="comments" name="comments" rows="5" cols="40"></textarea>

<br><br>

<input type="submit" value="Register">

</form>

</main>

<footer>
    <p>Web Design Project</p>
</footer>

</body>
</html>
